<style>
:root{
  /* สีชุดเดียวกับพอร์ทัล se-rmutl.github.io/se-wil: น้ำเงิน SE = 305, แดงเลือดหมู RMUTL = 304, ทอง = สถานประกอบการ */
  --navy:#13294b; --gold-rule:#d9a032;
  --paper:#f3f6fa; --surface:#fff; --ink:#1c2534; --muted:#576377; --rule:#d8e0ea;
  --c305:#2459a6; --c305-soft:#eaf1fa; --c304:#8e1f16; --c304-soft:#f8ecea;
  --work:#b57a0e; --work-soft:#fbf3e2; --ok:#24704a; --ok-soft:#e7f3ec; --bad:#c0362c; --bad-soft:#fbe9e7;
  --display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif; --body:"Sarabun","IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 70px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.3;margin:0;color:var(--navy)}
h1{font-size:24px} h2{font-size:20px;margin:26px 0 10px} h3{font-size:17px;margin:18px 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)} .small{font-size:14px}
.mono{font-family:var(--mono);font-size:.9em}
a{color:var(--c305)}
.bar{background:var(--surface);border-bottom:3px solid var(--gold-rule)}
.bar .in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .brand{font-family:var(--display);font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px;text-decoration:none}
.bar .brand img{height:34px;width:auto;display:block}
.bar .guide{font-size:14px}
.login .logos{display:flex;gap:10px;align-items:center;margin-bottom:10px}.login .logos img{height:52px;width:auto}
.clist{list-style:none;margin:0;padding:0}.clist li{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--rule)}.clist li:first-child{border-top:0}
.clist .crole{min-width:120px;color:var(--muted);font-size:14px;font-family:var(--display)}
.svc{margin:10px 0;padding:10px 12px;background:var(--paper);border-radius:8px}.svc .filebtn{display:inline-block;margin-top:6px}
.photo img{display:block;max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--rule);margin-top:4px}
a.btn{text-decoration:none;display:inline-block}
.bar .who{margin-left:auto;font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:14px 0}
.card.c305{border-top:4px solid var(--c305)} .card.c304{border-top:4px solid var(--c304)} .card.w{border-top:4px solid var(--work)}
.tabs{display:flex;gap:6px;margin:14px 0 4px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:inherit;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c305);font-weight:600}
.btn{font:inherit;border-radius:8px;border:1px solid var(--c305);background:var(--c305);color:#fff;padding:8px 16px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--c305)}
.btn.warn{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold-rule);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label,.lbl{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=time],input[type=number],select,textarea{
  font:inherit;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
fieldset{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin:14px 0}
legend{font-family:var(--display);font-size:16px;padding:0 6px}
.choice{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:15px}
.choice input{margin-top:5px}
.chip{display:inline-block;font-size:13px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
.chip.s-draft,.chip.s-none{color:var(--muted)}
.chip.s-submitted,.chip.s-pending{color:var(--work);border-color:var(--work);background:var(--work-soft)}
.chip.s-returned,.chip.s-partial{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chip.s-agreement_sent{color:var(--c305);border-color:var(--c305);background:var(--c305-soft)}
.chip.s-signed,.chip.s-certified{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.k305{color:var(--c305);border-color:var(--c305)} .chip.k304{color:var(--c304);border-color:var(--c304)}
.note{border-left:4px solid var(--c304);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.note.bad{border-left-color:var(--bad)} .note.ok{border-left-color:var(--ok)} .note.w{border-left-color:var(--work)}
.errors{color:var(--bad);margin:8px 0;padding-left:20px}
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--display);font-weight:500;font-size:13.5px;color:var(--muted);background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.week{margin:18px 0 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.week b{font-family:var(--display);font-weight:500}
.progress{margin:10px 0}
.progress .top{display:flex;justify-content:space-between;font-size:14px;gap:8px;flex-wrap:wrap}
.meter{position:relative;height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--rule);overflow:hidden;margin-top:4px}
.meter span{position:absolute;top:0;bottom:0;left:0}
.meter .cert305{background:var(--c305)} .meter .pend305{background:var(--c305-soft)}
.meter .cert304{background:var(--c304)} .meter .pend304{background:var(--c304-soft)}
.meter .exp{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--work)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-family:var(--display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:13.5px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 14px;margin:8px 0;font-size:15px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.confirm{border:1px solid var(--work);background:var(--work-soft);border-radius:10px;padding:12px 14px;margin:10px 0}
.login{max-width:460px;margin:7vh auto 0}
@media (max-width:640px){dl.kv{grid-template-columns:1fr} .wrap{padding:12px 12px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* สิ่งที่ต้องทำ คำแนะนำ และการจับคู่อาจารย์นิเทศ */
.card.todo{border-top:4px solid var(--navy)}
.todo-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.todo-grid{grid-template-columns:minmax(0,1fr)}}
.card.todo h2{margin:0 0 8px;font-size:19px}
.card.todo h3{margin:0 0 8px;font-size:16px}
.todo-list{list-style:none;margin:0;padding:0}
.todo-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--rule)}
.todo-list li:first-child{border-top:0}
.todo-list .tt{flex:1;min-width:0}
.todo-list .tk{flex:0 0 auto;font-size:12.5px;line-height:1.6;padding:0 8px;border-radius:6px;white-space:nowrap;margin-top:2px}
.todo-list .k-do .tk{background:var(--c305-soft);color:var(--c305)}
.todo-list .k-late .tk{background:var(--bad-soft);color:var(--bad)}
.todo-list .k-wait .tk{background:var(--work-soft);color:var(--work)}
.todo-list .k-ok .tk{background:var(--ok-soft);color:var(--ok)}
.todo-next ul{list-style:none;margin:0;padding:0;font-size:14.5px}
.todo-next li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;padding:5px 0;border-top:1px solid var(--rule)}
.todo-next li:first-child{border-top:0}
.todo-next b{font-family:var(--display);font-weight:600;color:var(--navy);white-space:nowrap}
details.guide summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--navy)}
details.guide ol{margin:10px 0 6px;padding-left:22px}
details.guide li{margin:4px 0}
.twostep{display:inline-flex;gap:6px;flex-wrap:wrap}
tr.mine td{background:var(--c305-soft)}
</style>
