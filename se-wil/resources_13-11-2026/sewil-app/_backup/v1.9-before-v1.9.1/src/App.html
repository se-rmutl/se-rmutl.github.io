<script>
(function () {
  'use strict';
  var S = { session: null, me: null, tab: null, editEntry: null };
  var KEY = 'sewil_session';
  var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  var STATUS = { none: 'ยังไม่กรอก', draft: 'ร่าง', submitted: 'รอหลักสูตรตรวจ', returned: 'ส่งกลับให้แก้ไข', agreement_sent: 'รอสถานประกอบการยืนยัน', signed: 'ยืนยันแล้ว' };
  var ESTATUS = { draft: 'ร่าง', pending: 'รอรับรอง', certified: 'รับรองแล้ว', returned: 'ส่งกลับ', partial: 'รับรองบางส่วน' };

  /* ---------- helpers ---------- */
  function store(v) {
    try {
      if (v === undefined) return localStorage.getItem(KEY);
      if (v === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, v);
    } catch (e) { }
    return null;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(String(c)));
    else el.appendChild(c);
  }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function mount(node) {
    var app = document.getElementById('app');
    app.innerHTML = '';
    add(app, node);
    try { window.scrollTo(0, 0); } catch (e) { }
  }
  function loading() { return h('p', { class: 'muted' }, 'กำลังโหลด…'); }
  var toastTimer = null;
  function toast(msg, bad) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 7000 : 3500);
  }
  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (resolve) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          r = r || { ok: false, error: 'ไม่มีคำตอบจากเซิร์ฟเวอร์' };
          if (r.auth && S.session) { store(null); S.session = null; showLogin(r.error); }
          resolve(r);
        })
        .withFailureHandler(function (e) { resolve({ ok: false, error: (e && e.message) || String(e) }); });
      runner[fn].apply(runner, args);
    });
  }
  function fail(r) {
    if (r.auth) return;
    mount(h('div', { class: 'note bad' }, h('p', {}, r.error || 'เกิดข้อผิดพลาด'), h('button', { class: 'btn sec small', onclick: function () { location.reload(); } }, 'ลองใหม่')));
  }
  function errorList(r) {
    var list = r.errors && r.errors.length ? r.errors : [r.error || 'เกิดข้อผิดพลาด'];
    return h('ul', { class: 'errors' }, list.map(function (e) { return h('li', {}, e); }));
  }
  function parseD(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
  function fmtTh(s) { var d = parseD(s); return d ? d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear() + 543).slice(2) : '—'; }
  function dowTh(s) { var d = parseD(s); return d ? DOW[d.getUTCDay()] : ''; }
  function fmtTs(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return String(iso);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(2) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function mondayOf(d) { return new Date(d.getTime() - ((d.getUTCDay() + 6) % 7) * 864e5); }
  function weekIdx(date, start) { return Math.floor((mondayOf(parseD(date)) - mondayOf(parseD(start))) / (7 * 864e5)) + 1; }
  function weekRangeTh(n, start) {
    var a = new Date(mondayOf(parseD(start)).getTime() + (n - 1) * 7 * 864e5), b = new Date(a.getTime() + 6 * 864e5);
    return fmtTh(a.toISOString()) + ' – ' + fmtTh(b.toISOString());
  }
  function mins(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function hoursOf(s, e, b) { var a = mins(s), z = mins(e), br = Number(b || 0); if (a === null || z === null || z <= a || br < 0) return null; var x = z - a - br; return x > 0 ? Math.round(x / 60 * 100) / 100 : null; }
  function r2(x) { return Math.round(x * 100) / 100; }
  function fld(id, label, el, hint) { return h('div', { class: 'field' }, h('label', { for: id }, label), el, hint ? h('span', { class: 'hint' }, hint) : null); }
  function kv(k, v) { return [h('dt', {}, k), h('dd', {}, v === undefined || v === null || v === '' ? '—' : String(v))]; }
  function tile(n, label) { return h('div', { class: 'tile' }, h('b', {}, String(n)), h('span', {}, label)); }

  /* ---------- สิ่งที่ต้องทำ และคำแนะนำตามบทบาท ---------- */
  var TODO_KIND = { do: 'ต้องทำ', late: 'เลยกำหนด', wait: 'รอ', ok: 'เรียบร้อย' };
  function todoCard(t, go) {
    if (!t) return null;
    var now = t.now || [], next = t.next || [];
    return h('section', { class: 'card todo', 'aria-label': 'สิ่งที่ต้องทำ' },
      h('div', { class: 'todo-grid' },
        h('div', {}, h('h2', {}, 'สิ่งที่ต้องทำ'),
          h('ul', { class: 'todo-list' }, now.map(function (it) {
            return h('li', { class: 'k-' + it.kind }, h('span', { class: 'tk' }, TODO_KIND[it.kind] || ''),
              h('span', { class: 'tt' }, it.text, it.due ? h('span', { class: 'small muted' }, ' · กำหนด ' + fmtTh(it.due)) : null),
              it.go && go ? h('button', { class: 'btn sec small', type: 'button', onclick: function () { go(it.go); } }, 'ไปที่รายการ') : null);
          }))),
        next.length ? h('div', { class: 'todo-next' }, h('h3', {}, 'กำหนดการถัดไป'),
          h('ul', {}, next.map(function (x) { return h('li', {}, h('b', {}, fmtTh(x.date)), h('span', {}, x.title)); }))) : null));
  }
  var GUIDE = {
    student: { title: 'คำแนะนำสำหรับนักศึกษา', path: 'student/index.html', items: [
      'แจ้งผู้นิเทศงานก่อนกรอกชื่อ อีเมล และเบอร์ของท่านในฟอร์ม เพราะระบบจะส่งข้อตกลงไปที่อีเมลนั้น',
      'ทุกคนต้องมีแบบตอบรับ SE-WIL00 ที่สถานประกอบการลงนาม แม้ฝึกที่เดิม ส่งข้อมูลแล้วพิมพ์ฉบับมีข้อมูลได้ในหน้านี้ แล้วแนบฉบับที่ลงนามภายในวันยืนยันข้อตกลง',
      'เมื่อหลักสูตรอนุมัติ ผู้นิเทศงานจะได้อีเมลให้ยืนยันข้อตกลง SE-WIL01 คุณจะได้สำเนาด้วย',
      'บันทึก logbook ทุกวันทำงาน บอกว่าทำอะไร ได้ผลอะไร ใช้เครื่องมืออะไร แท็ก 305 งานตามตำแหน่ง 304 งานโครงงาน วันที่ไม่ได้ไปทำงานให้บันทึกเหตุ (ป่วย ลากิจ บริษัทหยุด)',
      'ชั่วโมงนับเมื่อผู้นิเทศงานรับรองแล้วเท่านั้น ระบบส่งให้รับรองทุกวันศุกร์ รายการที่ถูกส่งกลับให้แก้แล้วจะส่งรอบถัดไป',
      'ทุกเรื่องของรายวิชา ติดต่อผู้ประสานงาน SE-WIL ก่อน'] },
    teacher: { title: 'คำแนะนำสำหรับอาจารย์นิเทศ', path: 'teacher/index.html', items: [
      'เลือกนักศึกษาที่จะดูแลในแท็บ "จับคู่อาจารย์นิเทศ" ควรเลือกนักศึกษาที่อยู่สถานประกอบการเดียวกัน เพื่อให้นิเทศครั้งเดียวพบได้หลายคน',
      'เมื่อท่านยืนยันแล้ว อาจารย์ท่านอื่นเลือกนักศึกษาคนนั้นไม่ได้ ท่านยกเลิกได้เอง หรือให้ผู้ประสานงานเปลี่ยนให้',
      'หลังเลือก แท็บ "นักศึกษาของฉัน" แสดงข้อมูลที่ฝึก ข้อตกลง CV ผู้ติดต่อ และชั่วโมงของนักศึกษาที่ท่านดูแลเท่านั้น',
      'ติดตามคอลัมน์ข้อสังเกตทุกสัปดาห์ และติดต่อนักศึกษาที่ไม่ได้บันทึก logbook เกิน 7 วัน',
      'ข้อเสนอโครงงาน บันทึกการนิเทศ และคะแนน จะเปิดในระบบตามสัปดาห์ที่ใช้งาน'] },
    admin: { title: 'คำแนะนำสำหรับผู้ประสานงานและผู้ดูแล', path: 'docs/system-roles.html', items: [
      'ตรวจและอนุมัติข้อมูลที่ฝึกให้ครบภายในกำหนด การอนุมัติส่งข้อตกลงให้สถานประกอบการทันที',
      'ดูให้นักศึกษาทุกคนมีอาจารย์นิเทศ กำหนดหรือเปลี่ยนให้ได้ในแท็บ "จับคู่อาจารย์นิเทศ" ชื่ออาจารย์ที่อนุมัติไปแล้วไม่เปลี่ยนใน PDF',
      'อาจารย์ต้องมีแถวในชีต Users (role = teacher) ก่อนจึงจะเข้าระบบและเลือกนักศึกษาได้',
      'ปิดการเลือกเองหลังจัดเสร็จ: ชีต Config ADVISOR_SELF_ASSIGN = FALSE · จำนวนสูงสุดต่ออาจารย์: ADVISOR_MAX',
      'รายการที่ยังไม่ยืนยันหลังกำหนด เปิดรายคนแล้วกด "ส่งข้อตกลงซ้ำ" หรือบันทึกการลงนามในเอกสาร',
      'แท็บ "เอกสาร": พิมพ์หนังสือแนะนำและแบบตอบรับของทุกคนครั้งเดียวให้หัวหน้าหลักสูตรลงนาม และเมื่อจับคู่อาจารย์ครบ ออกบันทึกขออนุมัติแต่งตั้งอาจารย์นิเทศ (Word หรือ PDF) เสนอคณะออกคำสั่ง',
      'ช่วงทดลอง แท็บ "รีเซ็ตเพื่อทดสอบ" ทำให้นักศึกษา ผู้นิเทศงาน หรืออาจารย์นิเทศกลับไปเหมือนเพิ่งเข้าใหม่ ปิดด้วย Config RESET_ENABLED = FALSE เมื่อเริ่มใช้จริง'] },
    supervisor: { title: 'คำแนะนำสำหรับผู้นิเทศงาน', path: 'company/supervisor.html', items: [
      'ยืนยันข้อตกลง SE-WIL01 ด้านล่างภายในกำหนด หรือลงนามในเอกสารแล้วส่งให้หลักสูตร',
      'ทุกวันศุกร์ระบบส่งอีเมลสรุปบันทึกของนักศึกษา ใช้ลิงก์นี้รับรองหรือส่งกลับพร้อมเหตุผล',
      'ตรวจว่าเวลาตรงกับที่ทำงานจริง และแท็กถูก: งานตามตำแหน่ง = 305 งานโครงงาน = 304 วันที่นักศึกษาแจ้งว่าไม่ได้ปฏิบัติงานไม่นับชั่วโมง เลือกไว้ = รับทราบ',
      'มีปัญหาเรื่องนักศึกษา ติดต่อผู้ประสานงาน SE-WIL ได้ทันที หรือตอบกลับอีเมลจากระบบ'] }
  };
  function guideCard(role) {
    var g = GUIDE[role];
    if (!g) return null;
    return h('details', { class: 'card guide' }, h('summary', {}, g.title),
      h('ol', {}, g.items.map(function (x) { return h('li', {}, x); })),
      BOOT.portal ? h('p', { class: 'small' }, h('a', { href: BOOT.portal + g.path, target: '_blank', rel: 'noopener' }, 'อ่านคู่มือฉบับเต็ม'), ' · ',
        h('a', { href: BOOT.portal + 'docs/system-roles.html', target: '_blank', rel: 'noopener' }, 'ใครทำอะไรในระบบ SE-WIL')) : null);
  }
  /* ---------- ผู้ติดต่อและไฟล์แนบ ---------- */
  function telLink(ph) { return ph ? h('a', { href: 'tel:' + String(ph).replace(/[^\d+]/g, '') }, ph) : null; }
  function contactLine(role, c) {
    if (!c || !(c.name || c.email || c.phone)) return null;
    return h('li', {}, h('span', { class: 'crole' }, role), h('span', {}, c.name || '',
      c.phone ? [' โทร ', telLink(c.phone)] : null, c.email ? [' ', h('a', { href: 'mailto:' + c.email }, c.email)] : null));
  }
  /** รวมบุคคลเดียวกัน (อีเมลเดียวกัน) ให้เหลือบรรทัดเดียว เช่น ผู้ประสานงานที่เป็นอาจารย์นิเทศด้วย */
  function mergeContacts(items) {
    var out = [], byEmail = {};
    items.forEach(function (x) {
      var c = x[1];
      if (!c || !(c.name || c.email || c.phone)) return;
      var key = c.email ? String(c.email).toLowerCase() : '';
      if (key && byEmail[key]) { byEmail[key][0] += ' และ' + x[0]; return; }
      var row = [x[0], c]; out.push(row);
      if (key) byEmail[key] = row;
    });
    return out;
  }
  function contactLines(items) { return mergeContacts(items).map(function (x) { return contactLine(x[0], x[1]); }); }
  function contactsCard(title, items, note) {
    var lis = contactLines(items);
    if (!lis.length) return null;
    return h('div', { class: 'card' }, h('h2', { style: 'margin-top:0' }, title),
      note ? h('p', { class: 'small muted', style: 'margin-top:0' }, note) : null, h('ul', { class: 'clist' }, lis));
  }
  function b64ToUrl(x) {
    var bin = atob(x.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], { type: x.mime }));
  }
  /** ปุ่มเตรียมไฟล์: กดครั้งแรกดึงไฟล์จากระบบ แล้วแสดงลิงก์ให้กดดาวน์โหลด (ต้องเป็นการกดของผู้ใช้เอง) */
  function fileButton(label, fn, args) {
    var box = h('span', { class: 'filebtn' });
    var b = h('button', { class: 'btn sec small', type: 'button' }, label);
    b.onclick = function () {
      b.disabled = true; b.textContent = 'กำลังเตรียมไฟล์…';
      call.apply(null, [fn].concat(args)).then(function (x) {
        if (!x.ok) { b.disabled = false; b.textContent = label; if (!x.auth) toast(x.error, true); return; }
        box.innerHTML = '';
        add(box, h('a', { class: 'btn small', href: b64ToUrl(x), download: x.name, target: '_blank', rel: 'noopener' }, 'ดาวน์โหลด ' + x.name));
      });
    };
    add(box, b);
    return box;
  }
  /** ปุ่มเตรียมลิงก์: กดแล้วขอลิงก์จากระบบ แล้วแสดงลิงก์ให้กดเปิดในแท็บใหม่ (ต้องเป็นการกดของผู้ใช้เอง) */
  function linkButton(label, fn, args, openLabel) {
    var box = h('span', { class: 'filebtn' });
    var b = h('button', { class: 'btn sec small', type: 'button' }, label);
    b.onclick = function () {
      b.disabled = true; b.textContent = 'กำลังเตรียม…';
      call.apply(null, [fn].concat(args)).then(function (x) {
        if (!x.ok) { b.disabled = false; b.textContent = label; if (!x.auth) toast(x.error, true); return; }
        box.innerHTML = '';
        add(box, h('a', { class: 'btn small', href: x.url, target: '_blank', rel: 'noopener noreferrer' }, openLabel + (x.count > 1 ? ' (' + x.count + ' คน)' : '')));
      });
    };
    add(box, b);
    return box;
  }
  /** รูปสถานประกอบการแบบย่อ โหลดเมื่อกด */
  function photoButton(fn, args, label) {
    label = label || 'ดูรูปสถานประกอบการ';
    var box = h('div', { class: 'photo' });
    var b = h('button', { class: 'btn sec small', type: 'button' }, label);
    b.onclick = function () {
      b.disabled = true; b.textContent = 'กำลังโหลดรูป…';
      call.apply(null, [fn].concat(args)).then(function (x) {
        if (!x.ok) { b.disabled = false; b.textContent = label; if (!x.auth) toast(x.error, true); return; }
        box.innerHTML = ''; add(box, h('img', { src: b64ToUrl(x), alt: label }));
      });
    };
    add(box, b);
    return box;
  }
  function linkOrDash(href, text) { return href ? h('a', { href: href, target: '_blank', rel: 'noopener' }, text || href) : '—'; }
  function kvNode(k, node) { return [h('dt', {}, k), h('dd', {}, node || '—')]; }


  function setBar(title) {
    var bar = document.getElementById('bar');
    bar.innerHTML = ''; bar.hidden = false;
    var right = S.session ? h('button', { class: 'btn sec small', onclick: logout }, 'ออกจากระบบ') : null;
    add(bar, h('div', { class: 'in' }, brand(), h('span', { class: 'small muted' }, 'ENGSE304/305 ภาค ' + BOOT.semester), h('span', { class: 'who' }, title || ''),
      BOOT.portal ? h('a', { class: 'guide', href: BOOT.portal + guidePath(), target: '_blank', rel: 'noopener' }, 'คู่มือและปฏิทิน') : null, right));
  }
  function logos() {
    if (!BOOT.portal) return [];
    return [h('img', { src: BOOT.portal + 'assets/img/rmutl-logo.jpg', alt: 'ตรามหาวิทยาลัยเทคโนโลยีราชมงคลล้านนา' }),
      h('img', { src: BOOT.portal + 'assets/img/se-logo.jpg', alt: 'ตราสาขาวิชาวิศวกรรมซอฟต์แวร์' })];
  }
  function brand() { return h('span', { class: 'brand' }, logos(), 'SE-WIL'); }
  function guidePath() {
    if (S.sv) return 'company/supervisor.html';
    if (S.me && S.me.role === 'student') return 'student/index.html';
    if (S.me) return 'teacher/index.html';

  function uploader(kind, p, r) {
    var U = UPLOAD_UI[kind], has = !!p[U.has];
    function doneText(name) { return kind === 'photo' ? 'แนบรูปแล้ว' : 'แนบแล้ว: ' + (name || U.short); }
    var status = h('span', { class: 'small' }, has ? doneText(U.nameKey ? p[U.nameKey] : '') : 'ยังไม่ได้แนบ');
    var input = h('input', { type: 'file', id: 'up-' + kind, accept: U.accept });
    var max = (r.uploads && r.uploads.maxMb) || 5;
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      if (f.size > max * 1048576) { toast('ไฟล์ใหญ่เกิน ' + max + ' MB', true); input.value = ''; return; }
      status.textContent = 'กำลังอัปโหลด…'; input.disabled = true;
      var rd = new FileReader();
      rd.onload = function () {
        call('api_placementUpload', S.session, kind, f.name, String(rd.result)).then(function (x) {
          input.disabled = false; input.value = '';
          if (!x.ok) { status.textContent = has ? 'ไฟล์เดิมยังอยู่' : 'ยังไม่ได้แนบ'; if (!x.auth) toast(x.error, true); return; }
          has = true; p[U.has] = true;
          status.textContent = doneText(x.name); toast('แนบไฟล์แล้ว');
        });
      };
      rd.onerror = function () { input.disabled = false; status.textContent = 'อ่านไฟล์ไม่ได้'; };
      rd.readAsDataURL(f);
    };
    if (!p.placement_id) return fld('up-' + kind, U.short, h('p', { class: 'small muted', style: 'margin:0' }, 'กด "บันทึกร่าง" ข้อมูลที่ฝึกก่อน แล้วจึงแนบไฟล์ได้'));
    var removeBtn = h('button', { class: 'btn warn small', type: 'button', onclick: function () {
      removeBtn.disabled = true;
      call('api_placementRemoveFile', S.session, kind).then(function (x) {
        removeBtn.disabled = false;
        if (!x.ok) { if (!x.auth) toast(x.error, true); return; }
        toast('ลบไฟล์แล้ว'); showStudent('place');
      });
    } }, 'ลบไฟล์');
    return fld('up-' + kind, U.label.replace('{mb}', max) + (kind === 'cv' && r.uploads && r.uploads.cvRequired ? ' *' : ''),

  function shrinkImage(file, max, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }
