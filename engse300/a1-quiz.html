<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1 แบบฝึกกระบวนการและระเบียบสหกิจศึกษา ENGSE300 | SE RMUTL Class Portal</title>
  <meta name="description" content="แบบฝึก A1 กระบวนการและระเบียบสหกิจศึกษา 20 ข้อ รายวิชา ENGSE300 มทร.ล้านนา ตรวจคำตอบและอธิบายทันที">
  <meta name="theme-color" content="#10253f">
  <link rel="canonical" href="https://se-rmutl.github.io/engse300/a1-quiz.html">
  <link rel="icon" href="../assets/se-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/class-portal.css?v=2">
  <script src="data.js?v=5" defer></script>
  <style>
    .course-page { --course: #bc8416; --ok: #39805e; --bad: #b9463e; }
    .top { padding: 44px 0 6px; }
    .top h1 { margin: 0; font-size: clamp(1.9rem, 4.2vw, 3rem); letter-spacing: -.03em; line-height: 1.15; }
    .top .lead { max-width: 760px; margin: 12px 0 0; color: #405a72; font-size: 1.02rem; }
    .info { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 18px; padding: 14px 18px; border-left: 4px solid var(--course); border-radius: 0 14px 14px 0; background: #fff; color: #405a72; font-size: .92rem; }
    .info a.btn-l { margin-left: auto; }
    .btn-l { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 16px; border: 1px solid var(--course); border-radius: 12px; background: var(--course); color: #fff; font: inherit; font-weight: 700; font-size: .92rem; text-decoration: none; cursor: pointer; }
    .btn-l.ghost { background: #fff; color: #7a520b; }
    .btn-l:focus-visible { outline: 3px solid var(--course); outline-offset: 3px; }
    .qs { display: grid; gap: 14px; margin: 26px 0 0; padding: 0; list-style: none; counter-reset: q; }
    .q { padding: 18px 20px; border: 1px solid var(--line); border-radius: 18px; background: #fff; counter-increment: q; }
    .q fieldset { margin: 0; padding: 0; border: 0; }
    .q legend { display: block; padding: 0; font-weight: 700; line-height: 1.5; }
    .q legend::before { margin-right: 6px; color: var(--course); content: counter(q) "."; }
    .q .topic { display: inline-block; margin: 0 0 6px; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--course), transparent 90%); color: #7a520b; font-size: .72rem; font-weight: 700; }
    .q label { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .q label:hover { background: var(--paper); }
    .q input { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: var(--course); }
    .q.checked label.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok), transparent 90%); }
    .q.checked label.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad), transparent 92%); }
    .q .explain { display: none; margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--paper); color: #314a62; font-size: .9rem; }
    .q.checked .explain { display: block; }
    .q .mark { display: none; margin-left: 8px; font-size: .8rem; font-weight: 800; }
    .q.checked .mark { display: inline; }
    .q.ok .mark { color: var(--ok); } .q.no .mark { color: var(--bad); }
    .q.missing { border-color: var(--bad); }
    .bar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 24px 0 64px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.96); box-shadow: 0 -8px 30px rgba(16,37,63,.08); }
    .bar .count { color: #405a72; font-size: .92rem; }
    .bar .spacer { flex: 1; }
    @media (max-width: 520px) { .bar { padding: 10px 12px; gap: 8px; } .bar .count { flex-basis: 100%; font-size: .84rem; } .bar .spacer { display: none; } .bar .btn, .bar button { flex: 1; } }
    .result { display: none; margin-top: 22px; padding: 20px 22px; border-radius: 18px; background: #fff; border: 1px solid var(--line); scroll-margin-top: 90px; }
    .result.show { display: block; }
    .result h2 { margin: 0; font-size: 1.6rem; }
    .result.pass h2 { color: var(--ok); } .result.fail h2 { color: var(--bad); }
    .result p { margin: 8px 0 0; color: #405a72; }
    .topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .topics span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
  </style>
</head>
<body class="course-page" data-tone="gold">
  <a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>
  <header class="site-header">
    <div class="wrap nav-shell">
      <a class="brand" href="../" aria-label="SE RMUTL Class Portal หน้ารวมรายวิชา">
        <img src="../assets/se-logo.png" alt="SE RMUTL" width="42" height="42">
        <span class="brand-text"><strong>วิศวกรรมซอฟต์แวร์ · มทร.ล้านนา</strong><span>Class Portal · ภาค 2/2569</span></span>
      </a>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="top">
      <a class="back-link" href="./#activities">กลับหน้า ENGSE300</a>
      <h1 id="title">A1 แบบทดสอบกระบวนการและระเบียบสหกิจศึกษา</h1>
      <p class="lead" id="lead"></p>
      <div class="info" id="info"></div>
    </section>

    <div class="result" id="result" role="status" aria-live="polite"></div>
    <ol class="qs" id="qs"></ol>

    <div class="bar">
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button type="button" class="btn-l ghost" id="reset">ทำใหม่ (สลับข้อ)</button>
      <button type="button" class="btn-l" id="check">ตรวจคำตอบ</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row"><strong>Class Portal · ENGSE300 · ภาคการศึกษาที่ 2/2569</strong><span id="updated"></span></div>
  </footer>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    "use strict";
    var D = window.ENGSE300;
    if (!D || !D.quizA1) return;
    var Q = D.quizA1;
    var total = Q.questions.length;
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function $(id) { return document.getElementById(id); }
    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    $("title").textContent = Q.title;
    $("lead").textContent = total + " ข้อ ข้อละ 1 คะแนน ผ่านเมื่อได้อย่างน้อย " + Q.passScore + " คะแนน (ร้อยละ 80) เนื้อหามาจากคาบที่ 1 และหน้ารายวิชา";
    $("info").innerHTML = Q.formUrl
      ? "<span>หน้านี้เป็นแบบฝึก ไม่บันทึกผล ทำแบบทดสอบจริงเพื่อส่ง A1 ที่ Google Form</span><a class=\"btn-l\" href=\"" + esc(Q.formUrl) + "\" target=\"_blank\" rel=\"noopener\">ทำแบบทดสอบจริง ↗</a>"
      : "<span>หน้านี้เป็นแบบฝึก ไม่บันทึกผล อาจารย์จะแจ้งลิงก์แบบทดสอบจริงสำหรับส่ง A1 ในคาบที่ 1</span>";
    $("updated").textContent = "ปรับปรุงล่าสุด " + D.meta.updated;

    var order = [];
    function render(mix) {
      order = Q.questions.map(function (q, i) {
        var opts = q.choices.map(function (c, k) { return { text: c, right: k === q.answer }; });
        return { q: q, i: i, opts: mix ? shuffle(opts) : opts };
      });
      if (mix) shuffle(order);
      $("qs").innerHTML = order.map(function (o, n) {
        return '<li class="q" id="q' + n + '"><fieldset><span class="topic">' + esc(o.q.topic) + "</span>" +
          "<legend>" + esc(o.q.q) + '<span class="mark"></span></legend>' +
          o.opts.map(function (c, k) {
            return '<label><input type="radio" name="a' + n + '" value="' + k + '"><span>' + esc(c.text) + "</span></label>";
          }).join("") + '<p class="explain">' + esc(o.q.explain) + "</p></fieldset></li>";
      }).join("");
      $("result").className = "result";
      $("result").innerHTML = "";
      count();
    }
    function answered() { return document.querySelectorAll("#qs input:checked").length; }
    function count() { $("count").textContent = "ตอบแล้ว " + answered() + " จาก " + total + " ข้อ"; }

    function check() {
      var r = $("result"), firstMissing = null, missing = 0;
      order.forEach(function (o, n) {
        var li = $("q" + n);
        var miss = !li.querySelector("input:checked");
        li.classList.toggle("missing", miss);
        if (miss) { missing++; if (!firstMissing) firstMissing = li; }
      });
      if (missing) {
        /* ยังไม่เฉลยจนกว่าจะตอบครบ */
        r.className = "result show fail";
        r.innerHTML = "<h2>ยังตอบไม่ครบ</h2><p>เหลืออีก " + missing + " ข้อ (กรอบสีแดง) ตอบให้ครบแล้วกดตรวจอีกครั้ง</p>";
        firstMissing.scrollIntoView({ block: "center" });
        return;
      }
      var score = 0, byTopic = {};
      order.forEach(function (o, n) {
        var li = $("q" + n);
        var picked = li.querySelector("input:checked");
        var t = byTopic[o.q.topic] || (byTopic[o.q.topic] = { ok: 0, all: 0 });
        t.all++;
        li.classList.remove("ok", "no");
        Array.prototype.forEach.call(li.querySelectorAll("label"), function (lab, k) {
          lab.classList.toggle("right", o.opts[k].right);
          lab.classList.remove("wrong");
        });
        var good = o.opts[Number(picked.value)].right;
        if (good) { score++; t.ok++; } else { picked.closest("label").classList.add("wrong"); }
        li.classList.add("checked", good ? "ok" : "no");
        li.querySelector(".mark").textContent = good ? "ถูก" : "ยังไม่ถูก";
      });
      var pass = score >= Q.passScore;
      r.className = "result show " + (pass ? "pass" : "fail");
      r.innerHTML = "<h2>" + score + " / " + total + " คะแนน · " + (pass ? "ผ่านเกณฑ์" : "ยังไม่ถึงเกณฑ์") + "</h2>" +
        "<p>" + (pass ? "พร้อมทำแบบทดสอบจริงแล้ว" : "อ่านคำอธิบายใต้ข้อที่ยังไม่ถูก แล้วกด \"ทำใหม่\" ระบบจะสลับลำดับข้อและตัวเลือก") + "</p>" +
        '<div class="topics">' + Object.keys(byTopic).map(function (k) { return "<span>" + esc(k) + " " + byTopic[k].ok + "/" + byTopic[k].all + "</span>"; }).join("") + "</div>";
      r.scrollIntoView({ block: "start" });
    }

    $("qs").addEventListener("change", count);
    $("check").addEventListener("click", check);
    $("reset").addEventListener("click", function () { render(true); window.scrollTo(0, 0); });
    render(false);
  });
  </script>
</body>
</html>
